name: Publish to gh-pages

# main 이 바뀌면 그 내용을 gh-pages 브랜치로 밀어 넣습니다.
# GitHub Pages 는 gh-pages 브랜치를 그대로 서빙하므로 1~2분 뒤 공개 사이트에 반영됩니다.
# (멤버가 data/members.js 를 고쳐 main 에 머지하면 자동으로 올라갑니다.)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push site to gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B gh-pages

          # 워크플로 파일은 배포본에 필요 없고, .nojekyll 로 Jekyll 처리를 건너뜁니다.
          rm -rf .github
          touch .nojekyll

          git add -A
          git commit -m "Publish ${GITHUB_SHA}" || echo "No changes to publish"
          git push --force origin gh-pages
