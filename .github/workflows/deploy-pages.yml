name: Deploy to GitHub Pages

# main 에 반영되면 바로 공개 사이트에 배포됩니다.
# (멤버가 data/members.js 를 고쳐 머지하면 1~2분 뒤 자동 반영)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 취소하지 않고 기다립니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # enablement: true — 저장소에 Pages 가 꺼져 있으면 켜 줍니다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # 빌드 과정이 없는 정적 사이트라 저장소 루트를 그대로 올립니다.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
